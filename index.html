
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    id="viewport"
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <meta name="theme-color" content="#000000">
  <title>Friday Night Funkin' - Whitty</title>

  <base href="https://cdn.jsdelivr.net/gh/bubbls/fnf-mods@6b6680f79ab8c4e8349a920c2a240c5e7ee689ea/whitty/">

  <link rel="shortcut icon" href="/favicon.png">
  <script src="Funkin.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    #openfl-content {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1;
    }

    #openfl-content canvas {
      display: block;
    }

    /* Overlay layer */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    /* Enter button in the upper-right corner */
    #enter-button {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: clamp(68px, 12vw, 104px);
      height: clamp(42px, 8vw, 58px);
      border: 2px solid #fff;
      border-radius: 12px;
      color: #fff;
      background: rgba(28, 28, 40, 0.82);
      font-size: clamp(13px, 2.5vw, 19px);
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #555;
      pointer-events: auto;
      touch-action: none;
      cursor: pointer;
    }

    #enter-button:active,
    #enter-button.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #555;
      background: #6b3acb;
    }

    /* Mouse click controls */
    #mouse-toggle {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 70px;
      min-width: 96px;
      height: 42px;
      padding: 0 10px;
      color: white;
      background: rgba(20,20,20,.75);
      border: 1px solid #888;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #mouse-controls {
      position: absolute;
      left: 50%;
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + min(22vw, 120px) + 14px);
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .mouse-button {
      min-width: clamp(100px, 27vw, 140px);
      height: 44px;
      border: 2px solid #fff;
      border-radius: 12px;
      color: #fff;
      background: rgba(28, 28, 40, .88);
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 0 #555;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .mouse-button:active,
    .mouse-button.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #555;
      background: #6b3acb;
    }

    #overlay.mouse-disabled #mouse-controls {
      display: none;
    }

    /* Directional control cluster */
    #controls {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(7px, 2vw, 16px);
      width: min(94vw, 470px);
      pointer-events: auto;
    }

    .arrow {
      --arrow-color: #fff;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 1;
      min-width: 0;
      border: 3px solid rgba(255,255,255,.95);
      border-radius: 18px;
      background: color-mix(in srgb, var(--arrow-color) 68%, #111);
      color: white;
      font-size: clamp(32px, 9vw, 56px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 3px 2px #222;
      box-shadow:
        0 5px 0 rgba(0,0,0,.7),
        inset 0 0 12px rgba(255,255,255,.25);
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: filter .06s, transform .06s;
    }

    .arrow:active,
    .arrow.pressed {
      transform: translateY(4px) scale(.96);
      filter: brightness(1.4);
      box-shadow:
        0 1px 0 rgba(0,0,0,.7),
        inset 0 0 18px rgba(255,255,255,.5);
    }

    #left  { --arrow-color: #2698ff; }
    #down  { --arrow-color: #ff3e46; }
    #up    { --arrow-color: #42e86c; }
    #right { --arrow-color: #bd57ff; }

    /* Optional overlay visibility toggle */
    #hide-button {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      width: 48px;
      height: 42px;
      color: white;
      background: rgba(20,20,20,.75);
      border: 1px solid #888;
      border-radius: 10px;
      font-size: 20px;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #overlay.hidden #controls {
      display: none;
    }

    @media (orientation: landscape) {
      #mouse-controls {
        left: auto;
        right: 18px;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: none;
        flex-direction: column;
      }

      #controls {
        left: 22px;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: none;
        width: min(48vw, 360px);
        gap: 8px;
      }

      .arrow {
        border-radius: 14px;
        font-size: clamp(28px, 5vw, 46px);
      }
    }

    @media (max-height: 430px) {
      #controls {
        width: min(46vw, 300px);
        bottom: 8px;
      }

      .arrow {
        border-width: 2px;
        border-radius: 12px;
      }

      #enter-button {
        top: 8px;
        right: 8px;
      }

      #mouse-controls {
        gap: 6px;
      }

      .mouse-button {
        height: 36px;
        min-width: 94px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="openfl-content"></div>

  <div id="overlay">
    <button id="hide-button" type="button" aria-label="Toggle arrows">
      ☰
    </button>

    <button id="mouse-toggle" type="button" aria-pressed="true">
      MOUSE ON
    </button>

    <button id="enter-button" type="button">
      ENTER
    </button>

    <div id="mouse-controls" aria-label="Mouse click controls">
      <button class="mouse-button" type="button" data-mouse-button="0">
        LEFT CLICK
      </button>
      <button class="mouse-button" type="button" data-mouse-button="2">
        RIGHT CLICK
      </button>
    </div>

    <div id="controls">
      <button class="arrow" id="left" type="button"
        aria-label="Left" data-key="ArrowLeft">←</button>

      <button class="arrow" id="down" type="button"
        aria-label="Down" data-key="ArrowDown">↓</button>

      <button class="arrow" id="up" type="button"
        aria-label="Up" data-key="ArrowUp">↑</button>

      <button class="arrow" id="right" type="button"
        aria-label="Right" data-key="ArrowRight">→</button>
    </div>
  </div>

  <script>
    (() => {
      const overlay = document.getElementById("overlay");
      const enterButton = document.getElementById("enter-button");
      const hideButton = document.getElementById("hide-button");
      const mouseToggle = document.getElementById("mouse-toggle");
      const activeKeys = new Map();
      const activeMouseButtons = new Map();

      // Keep the game canvas beneath the overlay.
      lime.embed("Funkin", "openfl-content", 1280, 720, {
        parameters: {}
      });

      // Send keyboard events to the game window.
      function sendKey(key, type) {
        const target = document.activeElement;
        const eventTarget =
          target && target !== document.body
            ? target
            : document;

        const event = new KeyboardEvent(type, {
          key: key,
          code: key,
          bubbles: true,
          cancelable: true,
          composed: true
        });

        eventTarget.dispatchEvent(event);
        window.dispatchEvent(new KeyboardEvent(type, {
          key: key,
          code: key,
          bubbles: true,
          cancelable: true
        }));

        // Also dispatch to the game canvas if available.
        const canvas = document.querySelector(
          "#openfl-content canvas"
        );

        if (canvas && canvas !== eventTarget) {
          canvas.dispatchEvent(new KeyboardEvent(type, {
            key: key,
            code: key,
            bubbles: true,
            cancelable: true
          }));
        }
      }

      function press(key, button) {
        if (activeKeys.has(key)) return;

        activeKeys.set(key, button);
        if (button) button.classList.add("pressed");

        sendKey(key, "keydown");
      }

      function release(key) {
        if (!activeKeys.has(key)) return;

        const button = activeKeys.get(key);
        activeKeys.delete(key);

        if (button) button.classList.remove("pressed");
        sendKey(key, "keyup");
      }

      function releaseAll() {
        for (const key of [...activeKeys.keys()]) {
          release(key);
        }
        releaseAllMouseButtons();
      }

      function dispatchMouseButton(buttonNumber, type) {
        const canvas = document.querySelector("#openfl-content canvas");
        const target = canvas || document;
        const rect = canvas?.getBoundingClientRect();
        const buttons = [...activeMouseButtons.keys()].reduce(
          (mask, button) => mask | (button === 0 ? 1 : 2), 0
        );

        target.dispatchEvent(new MouseEvent(type, {
          bubbles: true,
          cancelable: true,
          view: window,
          button: buttonNumber,
          buttons,
          clientX: rect ? rect.left + rect.width / 2 : 0,
          clientY: rect ? rect.top + rect.height / 2 : 0
        }));
      }

      function pressMouseButton(buttonNumber, buttonElement) {
        if (activeMouseButtons.has(buttonNumber)) return;
        activeMouseButtons.set(buttonNumber, buttonElement);
        buttonElement.classList.add("pressed");
        dispatchMouseButton(buttonNumber, "mousedown");
      }

      function releaseMouseButton(buttonNumber) {
        if (!activeMouseButtons.has(buttonNumber)) return;
        const buttonElement = activeMouseButtons.get(buttonNumber);
        activeMouseButtons.delete(buttonNumber);
        buttonElement.classList.remove("pressed");
        dispatchMouseButton(buttonNumber, "mouseup");
        if (buttonNumber === 0) {
          dispatchMouseButton(buttonNumber, "click");
        } else if (buttonNumber === 2) {
          dispatchMouseButton(buttonNumber, "contextmenu");
        }
      }

      function releaseAllMouseButtons() {
        for (const buttonNumber of [...activeMouseButtons.keys()]) {
          releaseMouseButton(buttonNumber);
        }
      }

      // Touch and mouse controls for the four arrows.
      document.querySelectorAll(".arrow").forEach(button => {
        const key = button.dataset.key;

        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          press(key, button);
        });

        button.addEventListener("pointerup", event => {
          event.preventDefault();
          release(key);
        });

        button.addEventListener("pointercancel", () => {
          release(key);
        });

        button.addEventListener("lostpointercapture", () => {
          release(key);
        });

        button.addEventListener("contextmenu", event => {
          event.preventDefault();
        });
      });

      // Enter button in the top-right corner.
      enterButton.addEventListener("pointerdown", event => {
        event.preventDefault();
        enterButton.setPointerCapture?.(event.pointerId);
        press("Enter", enterButton);
      });

      enterButton.addEventListener("pointerup", event => {
        event.preventDefault();
        release("Enter");
      });

      enterButton.addEventListener("pointercancel", () => {
        release("Enter");
      });

      enterButton.addEventListener("lostpointercapture", () => {
        release("Enter");
      });

      // Touch controls send mouse down/up events to the game canvas.
      document.querySelectorAll(".mouse-button").forEach(button => {
        const buttonNumber = Number(button.dataset.mouseButton);

        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          pressMouseButton(buttonNumber, button);
        });

        button.addEventListener("pointerup", event => {
          event.preventDefault();
          releaseMouseButton(buttonNumber);
        });

        button.addEventListener("pointercancel", () => {
          releaseMouseButton(buttonNumber);
        });

        button.addEventListener("lostpointercapture", () => {
          releaseMouseButton(buttonNumber);
        });

        button.addEventListener("contextmenu", event => {
          event.preventDefault();
        });
      });

      mouseToggle.addEventListener("click", () => {
        const enabled = overlay.classList.toggle("mouse-disabled") === false;
        mouseToggle.textContent = enabled ? "MOUSE ON" : "MOUSE OFF";
        mouseToggle.setAttribute("aria-pressed", String(enabled));
        if (!enabled) releaseAllMouseButtons();
      });

      // Toggle the arrows without hiding the Enter button.
      hideButton.addEventListener("click", () => {
        overlay.classList.toggle("hidden");
      });

      // Physical keyboard support.
      window.addEventListener("keydown", event => {
        const key = event.key.startsWith("Arrow")
          ? event.key
          : event.key === " "
            ? " "
            : event.key;

        if (
          ["ArrowLeft", "ArrowRight", "ArrowUp",
           "ArrowDown", "Enter", " "].includes(key)
        ) {
          if (event.cancelable) event.preventDefault();
          if (!activeKeys.has(key)) {
            activeKeys.set(key, null);
          }
        }
      }, { passive: false });

      window.addEventListener("keyup", event => {
        release(event.key);
      });

      window.addEventListener("blur", releaseAll);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) releaseAll();
      });

      // Prevent mobile scrolling and zoom gestures.
      document.addEventListener("touchmove", event => {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("contextmenu", event => {
        if (event.target.closest("#overlay")) {
          event.preventDefault();
        }
      });
    })();
  </script>
</body>
</html>
