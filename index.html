<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/granny@main/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unity WebGL Player | Granny</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: #080a12;
      font-family: system-ui, sans-serif;
    }

    #unityContainer {
      width: 100vw;
      height: 100vh;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      background: radial-gradient(ellipse at center, #202744 0%, #101321 48%, #080a12 100%);
      transition: opacity 400ms ease, visibility 400ms ease;
    }

    #loading-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(420px, 100%);
      text-align: center;
    }

    .loading-title {
      margin: 0 0 10px;
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 800;
      letter-spacing: 0.12em;
      background: linear-gradient(90deg, #a78bfa, #60d8ff, #a78bfa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: title-shimmer 2.5s linear infinite;
    }

    #loading-status {
      min-height: 24px;
      margin: 0 0 18px;
      color: #c7cee3;
      font-size: 14px;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 24px rgba(96, 216, 255, 0.12);
    }

    #loading-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b7bff, #50d7ed);
      transition: width 180ms ease;
    }

    #loading-error {
      margin: 18px 0 0;
      color: #ff9b9b;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @keyframes title-shimmer {
      to { background-position: 200% center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="unityContainer"></div>

  <div id="loading-screen" role="status" aria-live="polite">
    <div class="loading-card">
      <h1 class="loading-title">GRANNY</h1>
      <p id="loading-status">Preparing game files…</p>
      <div class="progress-track" aria-hidden="true">
        <div id="loading-bar"></div>
      </div>
      <p id="loading-error" hidden></p>
    </div>
  </div>

  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    const loadingScreen = document.querySelector("#loading-screen");
    const loadingStatus = document.querySelector("#loading-status");
    const loadingBar = document.querySelector("#loading-bar");
    const loadingError = document.querySelector("#loading-error");
    const partCount = 29;
    let completedParts = 0;
    let totalBytes = 0;
    let loadedBytes = 0;

    function updateLoading(percent, message) {
      const safePercent = Math.max(0, Math.min(100, percent));
      loadingBar.style.width = `${safePercent}%`;
      loadingStatus.textContent = message;
    }

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Could not download ${url} (HTTP ${response.status})`);
      }
      const buffer = await response.arrayBuffer();
      loadedBytes += buffer.byteLength;
      completedParts += 1;
      totalBytes += buffer.byteLength;
      const mbDone = (loadedBytes / (1024 * 1024)).toFixed(1);
      updateLoading(
        (completedParts / partCount) * 75,
        `Downloading game files… ${completedParts} of ${partCount} parts · ${mbDone} MB`
      );
      return buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      const parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }

    (async () => {
      try {
        updateLoading(0, "Preparing game files…");
        const [dataUrl] = await Promise.all([
          mergeFiles(
            getParts("Build/GrannyPortButBetter.data.unityweb", 1, 29),
            "GrannyPortButBetter.data.unityweb"
          )
        ]);

        updateLoading(75, "Starting Granny…");
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (url.includes("GrannyPortButBetter.data.unityweb")) {
            url = dataUrl;
          }
          return originalOpen.call(this, method, url, ...rest);
        };

        UnityLoader.instantiate(
          "unityContainer",
          "Build/GrannyPortButBetter.json",
          {
            onProgress: function (gameInstance, progress) {
              if (typeof UnityProgress === "function") {
                UnityProgress(gameInstance, progress);
              }
              updateLoading(75 + (progress * 25), "Starting Granny…");
              if (progress >= 1) {
                loadingScreen.classList.add("is-hidden");
              }
            }
          }
        );
      } catch (error) {
        loadingStatus.textContent = "The game could not be loaded.";
        loadingError.textContent = error.message || String(error);
        loadingError.hidden = false;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
