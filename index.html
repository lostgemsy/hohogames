<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOHO GAMES</title>
    <meta name="description" content="Play unblocked games. Fast, free, no downloads.">
    <style>
        /* ---------- WHITE MONOCHROME THEME (NO BLUE) ---------- */
        :root {
            --bg: #f5f5f7;
            --bg-2: #ffffff;
            --bg-3: #ececec;
            --text: #1a1a1a;
            --text-dim: #5a5a5a;
            --text-dim-2: #2a2a2a;
            --card: #ffffff;
            --card-hover: #f0f0f0;
            --card-border: #d0d0d0;
            --card-border-hover: #a0a0a0;
            --input-bg: #ffffff;
            --input-border: #c0c0c0;
            --input-border-focus: #1a1a1a;
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-glow: rgba(0, 0, 0, 0.02);
            --accent: #1a1a1a;
            --accent-2: #3a3a3a;
            --accent-glow: rgba(0, 0, 0, 0.06);
            --ring: rgba(0, 0, 0, 0.15);
            --scale: 1;
            --font-base: 14px;
            --meteor-color: #2a2a2a;
        }

        /* DARK THEME (monochrome dark, no blue) */
        body.dark-theme {
            --bg: #0a0a0a;
            --bg-2: #111111;
            --bg-3: #1a1a1a;
            --text: #f0f0f0;
            --text-dim: #aaaaaa;
            --text-dim-2: #cccccc;
            --card: #161616;
            --card-hover: #1e1e1e;
            --card-border: #2a2a2a;
            --card-border-hover: #4a4a4a;
            --input-bg: #1a1a1a;
            --input-border: #333333;
            --input-border-focus: #f0f0f0;
            --shadow: rgba(0, 0, 0, 0.5);
            --shadow-glow: rgba(0, 0, 0, 0.1);
            --accent: #f0f0f0;
            --accent-2: #cccccc;
            --accent-glow: rgba(255, 255, 255, 0.04);
            --ring: rgba(255, 255, 255, 0.12);
            --meteor-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { transition: background 0.35s ease, color 0.35s ease; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 20px 80px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            font-size: calc(var(--font-base) * var(--scale));
            position: relative;
        }

        /* ---------- METEOR SHOWER BACKGROUND ---------- */
        #meteorCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }
        body.dark-theme #meteorCanvas {
            opacity: 0.4;
        }

        /* Content above canvas */
        header, #container, #featuredZones, main, #zoneViewer, .chat-btn {
            position: relative;
            z-index: 1;
        }

        /* ---------- ANIMATIONS ---------- */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideInDown {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseDot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes slideChatIn {
            0% { transform: translateX(100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideChatOut {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
        @keyframes meteorFall {
            0% { transform: translateY(-100vh) translateX(0) rotate(45deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh) translateX(-200px) rotate(45deg); opacity: 0; }
        }

        /* ---------- HEADER ---------- */
        header {
            max-width: 1240px;
            margin: 0 auto 32px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 18px;
            padding: 22px 24px;
            border-radius: 0;
            background: var(--card);
            border: 2px solid var(--card-border);
            animation: slideInDown 0.55s cubic-bezier(0.2, 0.9, 0.25, 1.15) both;
            position: sticky;
            top: 12px;
            z-index: 100;
            box-shadow: 0 10px 40px -20px var(--shadow);
            transition: background 0.35s ease, border-color 0.35s ease;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
        }

        .title-wrap { display: flex; flex-direction: column; gap: 2px; }
        h1 {
            font-size: calc(clamp(1.6rem, 4.4vw, 2.35rem) * var(--scale));
            font-weight: 900;
            letter-spacing: -0.055em;
            line-height: 1;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 2px;
            transition: color 0.35s ease;
        }
        h1 .accent {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .tagline {
            font-size: calc(11.5px * var(--scale));
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
            transition: color 0.35s ease;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 200px;
        }
        .search-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            stroke: var(--text-dim);
            fill: none;
            stroke-width: 2.4;
            stroke-linecap: round;
            pointer-events: none;
            transition: stroke 0.2s ease;
        }
        .search {
            width: 100%;
            height: calc(50px * var(--scale));
            padding: 0 18px 0 46px;
            border-radius: 0;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            font-family: inherit;
            font-size: calc(14.5px * var(--scale));
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, color 0.35s ease;
        }
        .search:focus {
            border-color: var(--input-border-focus);
            background: var(--card-hover);
            box-shadow: 0 0 0 4px var(--ring);
        }
        .search-wrap:focus-within svg { stroke: var(--text); }
        .search::placeholder { color: var(--text-dim); }

        /* Rescale slider */
        .rescale-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
            height: calc(50px * var(--scale));
        }
        .rescale-wrap label {
            font-size: calc(12px * var(--scale));
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        .rescale-slider {
            -webkit-appearance: none;
            appearance: none;
            width: calc(140px * var(--scale));
            height: 6px;
            border-radius: 0;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            outline: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .rescale-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: calc(20px * var(--scale));
            height: calc(20px * var(--scale));
            border-radius: 0;
            background: var(--text);
            border: 3px solid var(--accent);
            box-shadow: 0 2px 8px var(--shadow);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .rescale-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 0 6px var(--ring);
        }
        .rescale-slider::-moz-range-thumb {
            width: calc(20px * var(--scale));
            height: calc(20px * var(--scale));
            border-radius: 0;
            background: var(--text);
            border: 3px solid var(--accent);
            box-shadow: 0 2px 8px var(--shadow);
            cursor: pointer;
        }
        .rescale-value {
            font-size: calc(12px * var(--scale));
            font-weight: 700;
            color: var(--accent);
            min-width: calc(38px * var(--scale));
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* Theme toggle button */
        .theme-toggle {
            width: calc(50px * var(--scale));
            height: calc(50px * var(--scale));
            border-radius: 0;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.25, 1.3), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.35s ease;
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            transform: translateY(-2px);
            border-color: var(--input-border-focus);
            background: var(--card-hover);
            box-shadow: 0 8px 20px -8px var(--shadow);
        }
        .theme-toggle:active { transform: scale(0.96); }
        .theme-toggle svg {
            width: calc(22px * var(--scale));
            height: calc(22px * var(--scale));
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.25, 1.3);
        }
        .theme-toggle:hover svg {
            transform: rotate(20deg);
        }

        /* ---------- MAIN ---------- */
        main {
            max-width: 1240px;
            margin: 0 auto;
            padding-bottom: 4rem;
        }

        details {
            margin-bottom: 1.75rem;
            animation: fadeUp 0.5s ease both;
        }
        details:nth-of-type(2) { animation-delay: 0.08s; }
        details summary {
            font-size: calc(1.1rem * var(--scale));
            font-weight: 800;
            letter-spacing: -0.02em;
            cursor: pointer;
            padding: 10px 4px;
            list-style: none;
            color: var(--text);
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }
        details summary::-webkit-details-marker { display: none; }
        details summary::before {
            content: "";
            width: 9px; height: 9px;
            border-right: 2.6px solid var(--text-dim);
            border-bottom: 2.6px solid var(--text-dim);
            transform: rotate(-45deg);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.25, 1.3), border-color 0.2s ease;
            margin-left: 4px;
        }
        details[open] summary::before {
            transform: rotate(45deg);
            border-color: var(--accent);
        }
        details summary:hover { color: var(--text-dim-2); }
        details summary:hover::before { border-color: var(--text-dim-2); }

        #container,
        #featuredZones {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(calc(180px * var(--scale)), 1fr));
            gap: calc(18px * var(--scale));
            margin-top: 1rem;
        }

        /* ---------- GAME CARD (FAST, SHARP, NO ROUND) ---------- */
        .zone-item {
            display: flex;
            flex-direction: column;
            padding: calc(10px * var(--scale));
            border-radius: 0;
            background: var(--card);
            border: 2px solid var(--card-border);
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.25, 1.2), border-color 0.15s ease, box-shadow 0.2s ease, background 0.15s ease;
            will-change: transform;
            contain: layout style paint;
            position: relative;
            overflow: hidden;
        }
        .zone-item::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, var(--accent-glow));
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        .zone-item:hover {
            border-color: var(--card-border-hover);
            background: var(--card-hover);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 28px -10px var(--shadow), 0 0 0 1px var(--accent-glow);
        }
        .zone-item:hover::before { opacity: 1; }
        .zone-item:hover img { transform: scale(1.03); }
        .zone-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 0;
            background: var(--bg-2);
            display: block;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.25, 1.2);
            position: relative;
            z-index: 1;
        }
        .zone-item button {
            background: transparent;
            color: var(--text);
            border: 0;
            padding: calc(12px * var(--scale)) 4px 4px;
            font-family: inherit;
            font-size: calc(14px * var(--scale));
            font-weight: 700;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.15s ease;
            position: relative;
            z-index: 1;
        }
        .zone-item:hover button { color: var(--text); }

        .empty-msg {
            grid-column: 1 / -1;
            padding: 50px 20px;
            text-align: center;
            color: var(--text-dim);
            font-weight: 600;
            font-size: calc(15px * var(--scale));
        }

        /* ---------- ZONE VIEWER (IFRAME) ---------- */
        #zoneViewer {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: none;
            flex-direction: column;
        }
        #zoneViewer.active {
            display: flex;
            animation: popIn 0.25s cubic-bezier(0.2, 0.9, 0.25, 1.15);
        }

        .zone-header {
            background: var(--bg-2);
            border-bottom: 2px solid var(--input-border);
            padding: calc(14px * var(--scale)) calc(20px * var(--scale));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            transition: background 0.35s ease, border-color 0.35s ease;
        }
        .zone-title { flex: 1; min-width: 0; }
        #zoneName {
            font-size: calc(1.1rem * var(--scale));
            font-weight: 800;
            margin: 0 0 3px;
            letter-spacing: -0.02em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
            transition: color 0.35s ease;
        }
        #zoneId { display: none; }
        #zoneAuthor {
            font-size: calc(12.5px * var(--scale));
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        #zoneAuthor:hover { color: var(--accent); }

        .zone-controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .zone-controls button {
            height: calc(40px * var(--scale));
            padding: 0 calc(16px * var(--scale));
            border-radius: 0;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            font-family: inherit;
            font-size: calc(12.5px * var(--scale));
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.25, 1.3), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.35s ease;
        }
        .zone-controls button:hover {
            transform: translateY(-2px);
            border-color: var(--input-border-focus);
            background: var(--card-hover);
            box-shadow: 0 8px 20px -8px var(--shadow);
        }
        .zone-controls button:active { transform: scale(0.96); }

        #zoneFrame {
            flex: 1;
            border: 0;
            width: 100%;
            background: #fff;
            transition: opacity 0.3s ease;
        }

        /* ---------- IFRAME LOADING OVERLAY ---------- */
        .iframe-loader {
            position: absolute;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .iframe-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .iframe-loader .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--card-border);
            border-top-color: var(--accent);
            border-radius: 0;
            animation: spinLoader 0.8s linear infinite;
        }
        .iframe-loader .loader-text {
            font-size: calc(14px * var(--scale));
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .iframe-loader .dots {
            display: flex;
            gap: 6px;
        }
        .iframe-loader .dots span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 0;
            animation: pulseDot 1.2s ease-in-out infinite;
        }
        .iframe-loader .dots span:nth-child(2) { animation-delay: 0.2s; }
        .iframe-loader .dots span:nth-child(3) { animation-delay: 0.4s; }

        /* ---------- CHAT BUTTON & PANEL ---------- */
        .chat-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 1000;
            width: 56px;
            height: 56px;
            border-radius: 0;
            border: 2px solid var(--card-border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.25, 1.3), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.35s ease;
            box-shadow: 0 8px 24px -8px var(--shadow);
        }
        .chat-btn:hover {
            transform: translateY(-4px) scale(1.05);
            border-color: var(--card-border-hover);
            background: var(--card-hover);
            box-shadow: 0 14px 32px -10px var(--shadow);
        }
        .chat-btn:active { transform: scale(0.94); }
        .chat-btn svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chat-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 380px;
            max-width: 100vw;
            height: 100vh;
            background: var(--bg-2);
            border-left: 2px solid var(--card-border);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.25, 1.15);
            box-shadow: -10px 0 40px -20px var(--shadow);
        }
        .chat-panel.open {
            transform: translateX(0);
        }
        .chat-panel-header {
            padding: 18px 20px;
            border-bottom: 2px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-2);
        }
        .chat-panel-header h3 {
            font-size: calc(16px * var(--scale));
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .chat-close {
            width: 36px;
            height: 36px;
            border-radius: 0;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .chat-close:hover {
            transform: rotate(90deg);
            border-color: var(--card-border-hover);
            background: var(--card-hover);
        }
        .chat-close svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.4;
            stroke-linecap: round;
        }
        .chat-panel iframe {
            flex: 1;
            border: 0;
            width: 100%;
            background: var(--bg);
        }
        .chat-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .chat-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* ---------- SKELETON LOADING ---------- */
        #container:empty::before {
            content: "";
            grid-column: 1 / -1;
            height: 200px;
            border-radius: 0;
            background: linear-gradient(90deg, var(--card) 0%, var(--card-hover) 50%, var(--card) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
        }

        /* ---------- MOBILE ---------- */
        @media (max-width: 700px) {
            body { padding: 14px 14px 60px; }
            header {
                padding: 16px;
                gap: 14px;
                position: static;
                top: auto;
            }
            .header-top { flex-wrap: wrap; }
            .header-left { gap: 12px; }
            h1 { font-size: calc(1.5rem * var(--scale)); }
            .tagline { font-size: calc(10px * var(--scale)); }
            .header-controls { width: 100%; }
            .search-wrap { width: 100%; flex: 1; min-width: 0; }
            .search { width: 100%; }
            .rescale-wrap { width: 100%; justify-content: center; }
            .rescale-slider { width: 100%; }
            #container, #featuredZones {
                grid-template-columns: repeat(2, 1fr);
                gap: calc(12px * var(--scale));
            }
            .zone-item { padding: calc(7px * var(--scale)); }
            .zone-item button { font-size: calc(12px * var(--scale)); padding: calc(10px * var(--scale)) 2px 2px; }
            .zone-controls button { height: calc(36px * var(--scale)); padding: 0 calc(12px * var(--scale)); font-size: calc(11.5px * var(--scale)); }
            .chat-panel { width: 100vw; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<canvas id="meteorCanvas"></canvas>

<header>
    <div class="header-top">
        <div class="header-left">
            <div class="title-wrap">
                <h1>HOHO <span class="accent">GAMES</span></h1>
                <span class="tagline">Play Unblocked</span>
            </div>
        </div>
    </div>
    <div class="header-controls">
        <div class="search-wrap">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="searchBar" class="search" placeholder="Search games..." autocomplete="off">
        </div>
        <div class="rescale-wrap">
            <label for="rescaleSlider">Scale</label>
            <input type="range" id="rescaleSlider" class="rescale-slider" min="10" max="200" value="100" step="5">
            <span class="rescale-value" id="rescaleValue">100%</span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
            <svg viewBox="0 0 24 24" id="themeIcon">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </div>
</header>

<main>
    <details id="featuredZonesWrapper" open>
        <summary id="allZonesSummary">Featured Games</summary>
        <div id="featuredZones"></div>
    </details>
    <details id="allZonesWrapper" open>
        <summary id="allSummary">All Games</summary>
        <div id="container">Loading...</div>
    </details>
</main>

<!-- CHAT BUTTON & PANEL -->
<button class="chat-btn" id="chatToggle" title="Open chat">
    <svg viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
</button>
<div class="chat-overlay" id="chatOverlay"></div>
<div class="chat-panel" id="chatPanel">
    <div class="chat-panel-header">
        <h3>Chat</h3>
        <button class="chat-close" id="chatClose">
            <svg viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>
    <iframe id="chatFrame" src="about:blank" title="Chat"></iframe>
</div>

<!-- ZONE VIEWER -->
<div id="zoneViewer">
    <div class="zone-header">
        <div class="zone-title">
            <h2 id="zoneName">game</h2>
            <span id="zoneId" style="display: none;"></span>
            <a id="zoneAuthor" href="#" target="_blank">by Author</a>
        </div>
        <div class="zone-controls">
            <button onclick="fullscreenZone()">Fullscreen</button>
            <button onclick="aboutBlank()">New Tab</button>
            <button onclick="closeZone()">Close</button>
        </div>
    </div>
    <div style="position: relative; flex: 1; display: flex;">
        <div class="iframe-loader" id="iframeLoader">
            <div class="spinner"></div>
            <div class="loader-text">Loading Game</div>
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
        </div>
        <iframe id="zoneFrame" allowfullscreen
            allow="autoplay; fullscreen; gamepad; clipboard-write; accelerometer; gyroscope"
            referrerpolicy="no-referrer"></iframe>
    </div>
</div>

<script>
/* =========================================================
   METEOR SHOWER BACKGROUND
   ========================================================= */
(function() {
    const canvas = document.getElementById('meteorCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    let meteors = [];
    const METEOR_COUNT = 30;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Meteor {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * w * 1.5 - w * 0.25;
            this.y = -Math.random() * h * 0.5 - 50;
            this.length = Math.random() * 120 + 60;
            this.speed = Math.random() * 3 + 2;
            this.size = Math.random() * 2 + 1;
            this.opacity = Math.random() * 0.5 + 0.3;
            this.delay = Math.random() * 200;
            this.frame = 0;
            this.active = false;
        }
        update() {
            this.frame++;
            if (this.frame < this.delay) return;
            this.active = true;
            this.x -= this.speed * 0.5;
            this.y += this.speed;
            if (this.y > h + 50 || this.x < -100) {
                this.reset();
            }
        }
        draw() {
            if (!this.active) return;
            const isDark = document.body.classList.contains('dark-theme');
            const color = isDark ? '255,255,255' : '40,40,40';
            const grad = ctx.createLinearGradient(
                this.x, this.y,
                this.x + this.length * 0.5, this.y - this.length
            );
            grad.addColorStop(0, `rgba(${color},${this.opacity})`);
            grad.addColorStop(1, `rgba(${color},0)`);
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + this.length * 0.5, this.y - this.length);
            ctx.strokeStyle = grad;
            ctx.lineWidth = this.size;
            ctx.stroke();
            // Head glow
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${color},${this.opacity})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < METEOR_COUNT; i++) {
        meteors.push(new Meteor());
    }

    function animate() {
        ctx.clearRect(0, 0, w, h);
        meteors.forEach(m => { m.update(); m.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
})();

/* =========================================================
   THEME TOGGLE (SVG icon switches)
   ========================================================= */
(function() {
    const toggle = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
        document.body.classList.add('dark-theme');
        updateIcon(true);
    }
    toggle.addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark-theme');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateIcon(isDark);
    });
    function updateIcon(isDark) {
        if (isDark) {
            // Moon icon
            icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        } else {
            // Sun icon
            icon.innerHTML = `
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            `;
        }
    }
})();

/* =========================================================
   RESCALE SLIDER
   ========================================================= */
(function () {
    const slider = document.getElementById('rescaleSlider');
    const valueLabel = document.getElementById('rescaleValue');
    const saved = localStorage.getItem('uiScalePercent');
    let initial = saved ? parseInt(saved) : 100;
    if (isNaN(initial) || initial < 10 || initial > 200) initial = 100;
    slider.value = initial;
    valueLabel.textContent = initial + '%';
    document.documentElement.style.setProperty('--scale', initial / 100);

    slider.addEventListener('input', () => {
        const pct = parseInt(slider.value);
        valueLabel.textContent = pct + '%';
        document.documentElement.style.setProperty('--scale', pct / 100);
        localStorage.setItem('uiScalePercent', pct);
    });
})();

/* =========================================================
   CHAT PANEL ANIMATION
   ========================================================= */
(function() {
    const chatToggle = document.getElementById('chatToggle');
    const chatPanel = document.getElementById('chatPanel');
    const chatOverlay = document.getElementById('chatOverlay');
    const chatClose = document.getElementById('chatClose');
    const chatFrame = document.getElementById('chatFrame');
    let chatLoaded = false;

    function openChat() {
        chatPanel.classList.add('open');
        chatOverlay.classList.add('open');
        if (!chatLoaded) {
            chatFrame.src = 'chat.html';
            chatLoaded = true;
        }
    }
    function closeChat() {
        chatPanel.classList.remove('open');
        chatOverlay.classList.remove('open');
    }
    chatToggle.addEventListener('click', openChat);
    chatClose.addEventListener('click', closeChat);
    chatOverlay.addEventListener('click', closeChat);
})();

/* =========================================================
   GAME LOADER (HOHO GAMES)
   ========================================================= */
const container = document.getElementById('container');
const featuredContainer = document.getElementById('featuredZones');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');
const searchBar = document.getElementById('searchBar');
const iframeLoader = document.getElementById('iframeLoader');

const zonesurls = [
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@master/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets/zones.json"
];
let zonesURL = zonesurls[0];
const coverURL = "https://cdn.jsdelivr.net/gh/lostgemsy/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/lostgemsy/html@main";
let zones = [];

async function listZones() {
    try {
        const response = await fetch(zonesURL + "?t=" + Date.now());
        const json = await response.json();
        zones = json;
        if (zones[0]) zones[0].featured = true;

        displayFeaturedZones(zones.filter(z => z.featured));
        displayZones(zones);

        const search = new URLSearchParams(window.location.search);
        const id = search.get('id');
        if (id) {
            const zone = zones.find(z => z.id + '' == id + '');
            if (zone) openZone(zone);
        }
    } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="empty-msg">Error loading games.</div>';
    }
}

function buildCardsHTML(list) {
    let html = '';
    for (let i = 0; i < list.length; i++) {
        const file = list[i];
        const cover = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        const safeName = file.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        html += '<div class="zone-item" data-id="' + file.id + '">' +
                    '<img src="' + cover + '" alt="' + safeName + '" loading="eager" decoding="async">' +
                    '<button>' + safeName + '</button>' +
                '</div>';
    }
    return html;
}

function displayFeaturedZones(list) {
    featuredContainer.innerHTML = buildCardsHTML(list);
    if (!list.length) featuredContainer.innerHTML = '<div class="empty-msg">No featured games.</div>';
    else document.getElementById("allZonesSummary").textContent = `Featured Games (${list.length})`;
    bindCardEvents(featuredContainer);
}

function displayZones(list) {
    container.innerHTML = buildCardsHTML(list);
    if (!list.length) container.innerHTML = '<div class="empty-msg">No games found.</div>';
    else document.getElementById("allSummary").textContent = `All Games (${list.length})`;
    bindCardEvents(container);
}

const cardClickHandlers = new WeakMap();
function bindCardEvents(containerEl) {
    if (cardClickHandlers.has(containerEl)) return;
    const handler = (e) => {
        const card = e.target.closest('.zone-item');
        if (!card) return;
        const id = card.dataset.id;
        const zone = zones.find(z => z.id + '' === id);
        if (zone) openZone(zone);
    };
    containerEl.addEventListener('click', handler);
    cardClickHandlers.set(containerEl, handler);
}

let searchTimer = null;
searchBar.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
        const q = searchBar.value.toLowerCase();
        const filtered = q ? zones.filter(z => z.name.toLowerCase().includes(q)) : zones;
        if (q) document.getElementById("featuredZonesWrapper").removeAttribute("open");
        displayZones(filtered);
    }, 80);
});

function openZone(file) {
    if (file.url.startsWith("http")) {
        window.open(file.url, "_blank");
        return;
    }
    // Show loader
    iframeLoader.classList.remove('hidden');

    const url = file.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    fetch(url + "?t=" + Date.now()).then(r => r.text()).then(html => {
        zoneFrame.contentDocument.open();
        zoneFrame.contentDocument.write(html);
        zoneFrame.contentDocument.close();

        document.getElementById('zoneName').textContent = file.name;
        document.getElementById('zoneId').textContent = file.id;
        document.getElementById('zoneAuthor').textContent = "by " + file.author;
        if (file.authorLink) document.getElementById('zoneAuthor').href = file.authorLink;
        zoneViewer.classList.add("active");

        // Hide loader after a short delay (content written)
        setTimeout(() => {
            iframeLoader.classList.add('hidden');
        }, 400);

        const u = new URL(window.location);
        u.searchParams.set('id', file.id);
        history.pushState(null, '', u.toString());
    }).catch(err => {
        alert("Failed to load game: " + err);
        iframeLoader.classList.add('hidden');
    });
}

function aboutBlank() {
    const w = window.open("about:blank", "_blank");
    const zone = zones.find(z => z.id + '' === document.getElementById('zoneId').textContent);
    if (!zone || !w) return;
    const url = zone.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    fetch(url + "?t=" + Date.now()).then(r => r.text()).then(html => {
        w.document.open();
        w.document.write(html);
        w.document.close();
    });
}

function closeZone() {
    zoneViewer.classList.remove("active");
    zoneFrame.src = "about:blank";
    iframeLoader.classList.remove('hidden');
    const u = new URL(window.location);
    u.searchParams.delete('id');
    history.pushState(null, '', u.toString());
}

function fullscreenZone() {
    if (zoneFrame.requestFullscreen) zoneFrame.requestFullscreen();
}

listZones();
</script>

</body>
</html>
